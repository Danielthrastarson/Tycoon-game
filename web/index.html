<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b121d">
<meta name="mobile-web-app-capable" content="yes">
<title>Genesis — First Army</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b121d;touch-action:none}
canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
nav{position:fixed;top:9px;right:10px;z-index:2;font:12px system-ui,sans-serif;color:#bccde1}
nav a{color:#a8dce5;text-decoration:none;background:#26394c;padding:5px 7px;border-radius:4px;margin-left:4px}
</style>
</head>
<body>
<nav>Labs: <a href="invention.html">Circuits</a><a href="universe.html">Voxels</a></nav>
<canvas id="glcanvas" tabindex="1"></canvas>
<script src="https://not-fl3.github.io/miniquad-samples/mq_js_bundle.js"></script>
<div id="game-error" role="alert" style="display:none;position:fixed;z-index:10;left:12px;right:12px;top:84px;padding:18px;border:1px solid #e8a79c;border-radius:10px;color:#fff;background:#3c252e;font:15px/1.5 system-ui,sans-serif">
  <strong>Genesis could not start.</strong>
  <span id="game-error-message">Please refresh or try Chrome.</span>
  <a href="https://github.com/Danielthrastarson/Tycoon-game/issues" style="color:#c6f0ff">Report the problem</a>
</div>
<noscript><p style="color:#fff">Genesis requires JavaScript and WebGL. Please enable JavaScript in your browser.</p></noscript>
<script>
function genesisError(message){
  const box=document.getElementById('game-error');
  const text=document.getElementById('game-error-message');
  if(box && text){ text.textContent=' '+String(message)+' Refresh or try Chrome. '; box.style.display='block'; }
}
window.addEventListener('error',event=>{
  if(event.message && (/webgl|wasm|load|uncaught|script/i).test(event.message)){
    genesisError(event.message);
  }
});
window.addEventListener('unhandledrejection',event=>{
  genesisError(event.reason?.message || 'WebAssembly load failed.');
});
try {
  if(typeof load!=='function') throw Error('The graphics engine script did not load.');
  load('game.wasm?v=0.4.1');
} catch(err) {
  genesisError(err.message || String(err));
}
setTimeout(()=>{
  const c=document.getElementById('glcanvas');
  if(!c || c.width<=300 && c.height<=150){
    genesisError('The canvas did not initialize. This browser may not support WebGL.');
  }
},10000);
</script>
</body>
</html>
