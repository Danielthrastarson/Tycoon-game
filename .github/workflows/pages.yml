name: Genesis — Build and Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Test both experiments
        run: cargo test --lib
      - name: Test original conservation
        run: cargo run --release --bin lab -- 400
      - name: Compile both browser games
        run: |
          cargo build --release --bin invention --target wasm32-unknown-unknown
          cargo build --release --bin genesis --target wasm32-unknown-unknown
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Compile both games
        run: |
          cargo build --release --bin invention --target wasm32-unknown-unknown
          cargo build --release --bin genesis --target wasm32-unknown-unknown
      - name: Stage website
        run: |
          mkdir -p dist/scripts
          cp web/index.html web/universe.html web/manifest.webmanifest dist/
          cp web/scripts/*.js dist/scripts/
          cp target/wasm32-unknown-unknown/release/invention.wasm dist/game.wasm
          cp target/wasm32-unknown-unknown/release/genesis.wasm dist/universe.wasm
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
