name: Genesis V0.4 — Tactical Ablation Laboratory
on:
  pull_request:
    branches: [main]
    paths:
      - src/frontier_combat.rs
      - src/bin/combat_lab.rs
      - src/lib.rs
      - docs/combat_v04_protocol.md
      - docs/combat_v042_objectives.md
      - scripts/analyze_combat_v04.py
      - .github/workflows/combat-lab.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Deterministic invariants, ablation isolation and replay
        run: cargo test --lib frontier_combat
      - name: Complete 16-mask matched-seed screening
        run: |
          cargo run --release --bin combat_lab -- \
            --seeds 32 --ablation all --phase screening \
            --output results/combat_v04_screening.csv
          test "$(wc -l < results/combat_v04_screening.csv)" -eq 16385
          awk -F, 'NR>1 && $37 != 1 {exit 1}' results/combat_v04_screening.csv
      - name: Analyze paired wins, draws and surviving troops
        run: |
          python3 scripts/analyze_combat_v04.py \
            --csv results/combat_v04_screening.csv \
            --output results/combat_v04_report.md
          cat results/combat_v04_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve raw experimental evidence and interpretation
        uses: actions/upload-artifact@v4
        with:
          name: genesis-v042-16-factor-physical-objectives
          path: |
            results/combat_v04_screening.csv
            results/combat_v04_report.md
          retention-days: 45
