name: Genesis V0.4.3 — Diverse Tactical Maps and Adversaries
on:
  pull_request:
    branches: [main]
    paths:
      - src/frontier_combat.rs
      - src/bin/combat_lab.rs
      - src/lib.rs
      - scripts/analyze_combat_v04.py
      - docs/combat_v043_protocol.md
      - .github/workflows/combat-lab.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  four-layout-matched-screening:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        opponent: [standard, counter, pincer, fortress]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Physics and game invariants, reproducible map reachability
        run: cargo test --lib frontier_combat
      - name: Matched-seed 16-factor ablation x 4 physical layouts
        run: |
          cargo run --release --bin combat_lab -- \
            --seeds 32 --ablation all --layout all \
            --opponent ${{ matrix.opponent }} --phase screening \
            --output results/combat_v043_${{ matrix.opponent }}.csv
          test "$(wc -l < results/combat_v043_${{ matrix.opponent }}.csv)" -eq 65537
          awk -F, 'NR>1 && $37 != 1 {exit 1}' results/combat_v043_${{ matrix.opponent }}.csv
      - name: Seed-clustered paired policy and geography analysis
        run: |
          python3 scripts/analyze_combat_v04.py \
            --csv results/combat_v043_${{ matrix.opponent }}.csv \
            --output results/combat_v043_${{ matrix.opponent }}_report.md
          cat results/combat_v043_${{ matrix.opponent }}_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve raw CSV and report per opponent
        uses: actions/upload-artifact@v4
        with:
          name: genesis-v043-${{ matrix.opponent }}-screening
          path: |
            results/combat_v043_${{ matrix.opponent }}.csv
            results/combat_v043_${{ matrix.opponent }}_report.md
          retention-days: 45
