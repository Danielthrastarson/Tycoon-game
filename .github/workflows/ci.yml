name: Genesis — Pull Request Verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [genesis-v03-emergent-groups]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Test simulation logic
        run: cargo test --lib
      - name: Audit original voxel universe
        run: cargo run --release --bin lab -- 200
      - name: Run agent-world experiment
        run: cargo run --release --bin society_lab -- 180 2
      - name: Compile all three browser games
        run: |
          cargo build --release --bin society --target wasm32-unknown-unknown
          cargo build --release --bin invention --target wasm32-unknown-unknown
          cargo build --release --bin genesis --target wasm32-unknown-unknown
