name: Genesis — Pull Request Verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [genesis-invention-lab-v02]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Test physics and invention rules
        run: cargo test --lib
      - name: Audit original voxel universe
        run: cargo run --release --bin lab -- 400
      - name: Compile both phone browsers
        run: |
          cargo build --release --bin genesis --target wasm32-unknown-unknown
          cargo build --release --bin invention --target wasm32-unknown-unknown
