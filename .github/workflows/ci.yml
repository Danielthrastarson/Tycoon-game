name: Genesis — Pull Request Verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [genesis-v05-settlement-emergence]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Test simulation logic
        run: cargo test --lib
      - name: Audit original voxel universe
        run: cargo run --release --bin lab -- 200
      - name: Run agent-world experiment
        run: cargo run --release --bin society_lab -- 1500 4
      - name: Deterministic army, logistics and resource contests
        run: cargo run --release --bin military_lab -- 350 4
      - name: Check autonomous settlement formation and no-construction controls
        run: cargo run --release --bin settlement_lab -- 1000 4
      - name: Test learned-carrying invariants
        run: cargo test --bin adaptation_lab
      - name: Run matched-seed seasonal learning ablation
        run: cargo run --release --bin adaptation_lab -- 720 4
      - name: Compile all three browser games
        run: |
          cargo build --release --bin society --target wasm32-unknown-unknown
          cargo build --release --bin invention --target wasm32-unknown-unknown
          cargo build --release --bin genesis --target wasm32-unknown-unknown
